name: Deploy to KingHost

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Lista única de exclusões (reaproveitada por todas as tentativas de FTP).
    # Só sobem os arquivos reais do site; dirs não-web (.agent com ~86 subpastas,
    # .claude, deploy_kinghost) ficam de fora para não estourar o idle de 60s do
    # servidor durante a criação de pastas (erro 421 No transfer timeout).
    env:
      FTP_EXCLUDE: |
        **/.git*
        **/.github/**
        **/.agent/**
        **/.claude/**
        **/node_modules/**
        **/backend/**
        **/backend-deploy/**
        **/deploy_kinghost/**
        **/.env*
        **/*.md
        **/*.txt
        **/*.ps1
        **/*.sh
        **/*.sqlite
        **/*.sqlite3
        **/package.json
        **/package-lock.json
        **/.gitignore
        **/.vscode/**
        **/.cursor/**
        **/.idea/**
        **/logs/**

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Secrets
        env:
          FTP_HOST: ${{ secrets.KINGHOST_FTP_HOST }}
          FTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
        run: |
          echo "🔍 Verificando configuração dos secrets FTP..."
          echo ""

          # Verificar KINGHOST_FTP_HOST
          if [ -z "$FTP_HOST" ]; then
            echo "❌ ERRO: KINGHOST_FTP_HOST não está configurado!"
            echo ""
            echo "📝 Como configurar no GitHub:"
            echo "1. Acesse: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "2. Clique em 'New repository secret'"
            echo "3. Nome: KINGHOST_FTP_HOST"
            echo "4. Valor: viladajuda.com.br"
            echo "5. Clique em 'Add secret'"
            echo ""
            exit 1
          fi

          # Verificar KINGHOST_FTP_PASSWORD
          if [ -z "$FTP_PASSWORD" ]; then
            echo "❌ ERRO: KINGHOST_FTP_PASSWORD não está configurado!"
            echo ""
            echo "📝 Como configurar no GitHub:"
            echo "1. Acesse: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "2. Clique em 'New repository secret'"
            echo "3. Nome: KINGHOST_FTP_PASSWORD"
            echo "4. Valor: 2026dAjudaVila"
            echo "5. Clique em 'Add secret'"
            echo ""
            exit 1
          fi

          echo "✅ Secrets FTP configurados!"
          echo "📡 FTP Host: $FTP_HOST"
          echo "👤 FTP Usuário: viladajuda"
          echo ""

      # ------------------------------------------------------------------
      # Deploy FTP com retry (a conexão FTP da KingHost é intermitente:
      # às vezes dá ETIMEDOUT na porta 21). 3 tentativas com espera crescente;
      # cada tentativa só roda se a anterior falhou. O sync-state do servidor
      # faz o retry retomar de onde parou (idempotente).
      # ------------------------------------------------------------------
      - name: Deploy FTP — tentativa 1
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.KINGHOST_FTP_HOST }}
          username: viladajuda
          password: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          timeout: 120000
          exclude: ${{ env.FTP_EXCLUDE }}

      - name: Aguardar antes da tentativa 2
        if: steps.ftp1.outcome == 'failure'
        run: |
          echo "⚠️ Tentativa 1 falhou. Aguardando 30s antes de retentar..."
          sleep 30

      - name: Deploy FTP — tentativa 2
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.KINGHOST_FTP_HOST }}
          username: viladajuda
          password: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          timeout: 120000
          exclude: ${{ env.FTP_EXCLUDE }}

      - name: Aguardar antes da tentativa 3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: |
          echo "⚠️ Tentativa 2 falhou. Aguardando 60s antes da última tentativa..."
          sleep 60

      - name: Deploy FTP — tentativa 3
        id: ftp3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.KINGHOST_FTP_HOST }}
          username: viladajuda
          password: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          timeout: 120000
          exclude: ${{ env.FTP_EXCLUDE }}

      - name: Confirmar resultado do deploy
        run: |
          if [ "${{ steps.ftp1.outcome }}" = "success" ] || \
             [ "${{ steps.ftp2.outcome }}" = "success" ] || \
             [ "${{ steps.ftp3.outcome }}" = "success" ]; then
            echo "✅ Deploy FTP concluído com sucesso."
          else
            echo "❌ Todas as 3 tentativas de deploy FTP falharam."
            echo "Provável instabilidade de conexão da KingHost (porta 21)."
            echo "Reexecute o workflow: gh workflow run deploy-kinghost.yml --ref master"
            exit 1
          fi
