name: Deploy to KingHost

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify Secrets
        env:
          FTP_HOST: ${{ secrets.KINGHOST_FTP_HOST }}
          FTP_USER: ${{ secrets.KINGHOST_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.KINGHOST_FTP_PASSWORD }}
        run: |
          echo "🔍 Verificando configuração dos secrets..."
          echo ""
          
          # Verificar KINGHOST_FTP_HOST
          if [ -z "$FTP_HOST" ]; then
            echo "❌ ERRO: KINGHOST_FTP_HOST não está configurado!"
            echo ""
            echo "📝 Como configurar:"
            echo "1. Acesse: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "2. Clique em 'New repository secret'"
            echo "3. Nome: KINGHOST_FTP_HOST"
            echo "4. Valor: viladajuda.web213.uni5.net ou ftp.viladajuda.web213.uni5.net"
            echo "5. Clique em 'Add secret'"
            echo ""
            exit 1
          fi
          
          # Verificar KINGHOST_FTP_USER
          if [ -z "$FTP_USER" ]; then
            echo "❌ ERRO: KINGHOST_FTP_USER não está configurado!"
            echo ""
            echo "📝 Como configurar:"
            echo "1. Acesse: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "2. Clique em 'New repository secret'"
            echo "3. Nome: KINGHOST_FTP_USER"
            echo "4. Valor: viladajuda"
            echo "5. Clique em 'Add secret'"
            echo ""
            exit 1
          fi
          
          # Verificar KINGHOST_FTP_PASSWORD
          if [ -z "$FTP_PASSWORD" ]; then
            echo "❌ ERRO: KINGHOST_FTP_PASSWORD não está configurado!"
            echo ""
            echo "📝 Como configurar:"
            echo "1. Acesse: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "2. Clique em 'New repository secret'"
            echo "3. Nome: KINGHOST_FTP_PASSWORD"
            echo "4. Valor: vila2026"
            echo "5. Clique em 'Add secret'"
            echo ""
            exit 1
          fi
          
          echo "✅ Todos os secrets estão configurados!"
          echo "📡 Host: $FTP_HOST"
          echo "👤 Usuário: $FTP_USER"
          echo ""
      
      - name: Deploy Frontend to KingHost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.KINGHOST_FTP_HOST }}
          username: ${{ secrets.KINGHOST_FTP_USER }}
          password: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/backend/**
            **/backend-deploy/**
            **/deploy_kinghost/**
            **/www/**
            **/.github/**
            **/instrucoes/**
            **/*.txt
            **/*.md
            **/*.ps1
            **/*.sh
            **/.vscode/**
            **/.cursor/**
            **/.idea/**
            **/logs/**
            **/package.json
            **/package-lock.json
            **/.gitignore
            **/README.md
            **/DEPLOY*.md
            **/TESTE*.txt
            **/ENVIAR*.txt
            **/CORRECOES*.txt
            **/AJUSTES*.txt
            **/FINAL*.txt
            **/URGENTE*.txt
            **/VERIFICAR*.txt
            **/LISTA*.txt
            **/RESOLVER*.txt
            **/DESCOBRIR*.txt
            **/DIAGNOSTICO*.txt
            **/IMPLEMENTACAO*.txt
            **/LAYOUT*.txt
            **/CACHE*.txt
            **/ICONES*.txt
            **/CARDS*.txt
            **/ECO*.txt
            **/EMAIL*.txt
            **/AVALIACOES*.txt
            **/RESERVA*.txt
            **/USUARIO*.txt
            **/ARQUIVOS*.txt
            **/3_*.txt
            **/Copy
            **/new_*.html
            **/old_*.html
            **/public/**
            **/api/**
          local-dir: ./
          dangerous-clean-slate: false
          log-level: verbose
      
      - name: Deploy API to KingHost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.KINGHOST_FTP_HOST }}
          username: ${{ secrets.KINGHOST_FTP_USER }}
          password: ${{ secrets.KINGHOST_FTP_PASSWORD }}
          server-dir: public_html/api/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env*
            **/teste*.php
            **/phpinfo.php
            **/hello.php
            **/info.php
            **/README*.md
            **/CONFIGURAR*.txt
          local-dir: ./api/
          dangerous-clean-slate: false
          log-level: verbose
      
      - name: Deployment Summary
        run: |
          echo "✅ Deploy concluído com sucesso!"
          echo "🌐 Site: https://www.viladajuda.com.br/"
          echo "📡 API: https://www.viladajuda.com.br/api/"

